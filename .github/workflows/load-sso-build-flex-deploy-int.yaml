name: Int - Load SSO Dataflow Push to Artifact Registry and Flex Template Upload

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: int/load-sso-dataflow
    defaults:
      run:
        shell: bash
        working-directory: ./load_sso

    env:
      PROJECT_ID: ${{ vars.GCP_INT_PROJECT_ID }}
      ENVIRONMENT: int
      GAR_LOCATION: ${{ vars.GCP_REGION }}
      REPOSITORY: ppdb-repo
      IMAGE: load-sso-image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_INT }}

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS_INT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:load_sso"
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Dataflow Flex Template
        run: |
          gcloud dataflow flex-template build "gs://ppdb-${{ env.ENVIRONMENT }}-dataflow/templates/load_sso_flex_template.json" \
            --image "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
            --sdk-language "PYTHON" \
            --metadata-file "metadata.json"
