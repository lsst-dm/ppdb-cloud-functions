name: Prod - Deploy All Workloads

on:
  workflow_dispatch:

# Independent jobs deploy all workloads in parallel.
jobs:
  stage-chunk:
    uses: ./.github/workflows/stage-chunk-deploy-prod.yaml
    secrets: inherit

  load-sso:
    uses: ./.github/workflows/load-sso-deploy-prod.yaml
    secrets: inherit

  export-diasource-min-ssp:
    uses: ./.github/workflows/export-diasource-min-ssp-deploy-prod.yaml
    secrets: inherit

  promote-chunks:
    uses: ./.github/workflows/promote-chunks-deploy-prod.yaml
    secrets: inherit
