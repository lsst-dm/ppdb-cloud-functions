name: Int - Promote Chunk Cloud Run Job Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: int/promote-chunks

    env:
      PROJECT_ID: ${{ vars.GCP_INT_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      GAR_LOCATION: ${{ vars.GCP_REGION }}
      REPOSITORY: ppdb-repo
      IMAGE: promote-chunks
      JOB_NAME: promote-chunks
      APP_SOURCE_PATH: promote_chunks
      RUNTIME: 'python313'
      ENTRY_POINT: 'promote_chunks'
      CPU: ${{ vars.PROMOTE_CHUNKS_CPU }}
      MEMORY: ${{ vars.PROMOTE_CHUNKS_MEMORY }}
      TIMEOUT: ${{ vars.PROMOTE_CHUNKS_TIMEOUT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:promote_chunks"
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run Job
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: ${{ env.JOB_NAME }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.REGION }}
